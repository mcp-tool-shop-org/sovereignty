# npx launcher: @mcptoolshop/sovereignty (source in npm/).
#
# The launcher downloads the `sov` binary for its own version from the GitHub
# Release, so it may only publish once that Release carries the CLI binaries
# and checksums. publish.yml attaches them on the same release event; this
# workflow waits for them (andon) and then publishes.
#
# Auth: npm Trusted Publishing (OIDC). The binding on npmjs.com names the
# filename release.yml (no environment) -- that name is load-bearing; do not
# rename this file. (publish.yml is the PyPI/binaries workflow; its PyPI
# Trusted Publisher binds to publish.yml the same way.)
# OIDC only: the first Trusted Publisher publish (2.3.2) is confirmed and the
# old NPM_TOKEN secret is retired. An E404 on publish means the npmjs.com
# binding no longer matches this repo/filename, not a missing token.
#
# Recovery: Actions -> npm launcher -> Run workflow with tag=vX.Y.Z. The shim
# derives everything from npm/package.json, so a dispatch from main publishes
# the version it names; the tag input must match it.
#
# Compensator: `npm deprecate @mcptoolshop/sovereignty@<v> "<reason>"` and
# publish a fixed patch (npm versions cannot be reused; unpublish only within
# 72 h). Owner: release operator.

name: npm launcher

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* GitHub Release tag whose binaries the launcher serves (e.g. v2.3.2).
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify launcher version matches tag
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::npm/package.json is $VERSION but the tag is $RELEASE_TAG"
            exit 1
          fi

      - name: Wait for release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          want="checksums-${VERSION}.txt sovereignty-${VERSION}-linux-x64 sovereignty-${VERSION}-darwin-arm64 sovereignty-${VERSION}-win-x64.exe"
          for attempt in $(seq 1 90); do
            have=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
            missing=""
            for a in $want; do grep -qx "$a" <<<"$have" || missing="$missing $a"; done
            if [ -z "$missing" ]; then echo "All launcher assets present."; exit 0; fi
            echo "attempt $attempt: waiting for$missing"
            sleep 30
          done
          echo "::error::Release $RELEASE_TAG never carried:$missing"
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install and test
        working-directory: npm
        run: |
          npm ci
          npm test

      - name: Publish
        working-directory: npm
        run: npm publish --provenance --access public

      # Two waits, kept apart so a failure says which one. Registry reads can
      # lag a fresh publish by several minutes; the v2.3.4 run gave up after
      # 5 min with stderr discarded, so its real cause was lost (the package
      # itself was fine). Wait for the registry first, then run npx and show
      # its stderr on failure.
      - name: Smoke test npx
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG="@mcptoolshop/sovereignty@${VERSION}"
          cd "$(mktemp -d)"
          for attempt in $(seq 1 40); do
            if [ "$(npm view "$PKG" version 2>/dev/null)" = "$VERSION" ]; then
              echo "registry serves $PKG (attempt $attempt)"
              break
            fi
            [ "$attempt" = 40 ] && { echo "::error::registry never served $PKG after 10 min"; exit 1; }
            sleep 15
          done
          for attempt in 1 2 3; do
            if npx --yes "$PKG" self-check --json > out.json 2> err.txt; then
              STATUS=$(jq -r .status out.json)
              echo "self-check status: $STATUS"
              case "$STATUS" in ok|warn) exit 0 ;; esac
              echo "::error::npx self-check reported $STATUS"
              exit 1
            fi
            echo "npx attempt $attempt failed:"
            tail -20 err.txt
            sleep 20
          done
          echo "::error::npx $PKG failed three times (stderr above)"
          exit 1
