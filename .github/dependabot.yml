# Dependabot config: keep SHA-pinned third-party Actions and runtime/dev
# dependencies fresh across pip, github-actions, site npm, app npm, and
# the Tauri cargo crate (W4CIDOCS-002 / F-d7957259).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Python project (pyproject.toml + uv.lock at repo root). Dependabot's pip
  # ecosystem reads pyproject.toml; uv-managed lock updates land via the
  # locked spec adjustment + `uv sync --frozen` in CI.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
    # Group dev-only bumps so we can auto-merge low-risk dev-tool churn
    # in a future Stage B-2 pass without burying runtime upgrades.
    groups:
      dev-dependencies:
        dependency-type: "development"

  # Astro/Starlight handbook site lives under /site with its own package.json.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      dev-dependencies:
        dependency-type: "development"

  # Desktop app (React 19 + Vite 6 + @tauri-apps/*) lives under /app.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      dev-dependencies:
        dependency-type: "development"

  # Tauri shell crate at /app/src-tauri.
  - package-ecosystem: "cargo"
    directory: "/app/src-tauri"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "rust"
