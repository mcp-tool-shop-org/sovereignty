<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sovereignty — Campfire Board (A · Parchment Heritage)</title>
<link rel="stylesheet" href="fonts.css">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #2a221a; }
  body { display: flex; justify-content: center; }
  #board-host { transform-origin: top center; }
  @media print {
    body { background: #fff; }
    #board-host { transform: none !important; }
  }
</style>
</head>
<body>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="tokens.js"></script>
  <script src="print-bundle.js"></script>
  <div id="board-host"></div>
  <script>
    const host = document.getElementById("board-host");
    function fit() {
      const s = Math.min(window.innerWidth / 1700, window.innerHeight / 2200, 1);
      host.style.transform = `scale(${s})`;
      host.style.width = "1700px";
    }
    window.addEventListener("resize", fit);
    ReactDOM.createRoot(host).render(React.createElement(window.SovBoardA));
    requestAnimationFrame(fit);
  </script>
</body>
</html>
