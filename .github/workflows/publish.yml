# Combined release workflow: PyPI publish + platform binaries.
# Asset naming convention (locked):
#   sovereignty-<version>-<os>-<arch>[.exe]            (PyInstaller CLI)
#   sovereignty-app-<version>-<target>.<dmg|msi|AppImage>  (Tauri desktop app, v2.1+)
#   sovereignty-app-<version>-<target>.app.tar.gz[.sig]    (Tauri updater payloads)
#   latest.json
#   checksums-<version>.txt / checksums-app-<version>.txt
#
# v2.1 BRIDGE-A-bis-003 distribution context: PyInstaller CLI binaries ship the
# Python ``sov`` command (already in place since v2.0). Wave 11 added the Tauri
# shell binary matrix alongside — built from ``app/src-tauri/`` via
# ``npm --prefix app run tauri build``, attested by
# ``actions/attest-build-provenance``, and uploaded to the same GH Release. NO
# OS-level code signing in v2.1 — workspace-level signing infrastructure
# (Apple Developer ID + Authenticode) ships in v2.2 (see docs/v2.2-backlog.md).
# Users see first-launch OS warnings; supply-chain provenance is verifiable
# via ``gh attestation verify``.
#
# Recovery (do not retag v2.3.0):
#   CLI/PyPI and desktop are separate jobs. A Tauri/linuxdeploy failure must
#   not skip PyPI or CLI GitHub Release assets. Re-run via Actions → Release
#   → Run workflow with inputs.tag=vX.Y.Z (from a workflow-fix branch or
#   from the tag ref; tag-ref dispatch must pass the same value). Blank tag
#   on the default branch fails require-release-tag (not a green no-op).
#   workflow_dispatch never creates or moves tags. Concurrency is keyed on
#   the target RELEASE_TAG so a branch recovery queues behind an in-flight
#   tag run rather than overlapping OIDC publishes.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing v* GitHub Release tag to attach assets to (e.g. v2.3.0).
          Required. When dispatching from a v* tag ref, pass the same value.
          Does not create or move tags.
        required: true
        type: string

concurrency:
  # Key on the target release tag (F-114f1242). github.ref would let a
  # workflow-fix branch recovery overlap an in-flight tag run (two OIDC
  # publishes, two attestations, mixed-SHA assets on one Release).
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.ref_name) || github.ref_name }}
  # One-shot Trusted Publisher + attestations: never cancel an in-flight publish.
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.ref_name) || github.ref_name }}

jobs:
  # Fail-loud when Actions → Release → Run workflow is used on the default
  # branch with a blank/non-v* tag (F-dad9a49b). Per-job `if` still skip
  # the publish matrix; without this job the run was a green zero-job success.
  require-release-tag:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless a v* tag is targeted
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "ok: github.ref=$GIT_REF"
            exit 0
          fi
          if [[ "$TAG_INPUT" =~ ^v ]]; then
            echo "ok: inputs.tag=$TAG_INPUT"
            exit 0
          fi
          echo "::error::Release requires github.ref=refs/tags/v* or workflow_dispatch inputs.tag matching ^v (event=$EVENT_NAME ref=$GIT_REF tag='$TAG_INPUT'). Actions → Release → Run workflow on the default branch with a blank tag is not a recovery; pass tag=vX.Y.Z or dispatch from the tag ref with the same value."
          exit 1

  # --- PyPI publish (trusted publishing via OIDC) ---
  # Locked spec: publish MUST depend on build-binaries success so a
  # major-version PyPI release is never shipped without the CLI binaries that
  # `npx @mcptoolshop/sovereignty` consumers resolve from the GitHub Release.
  # Desktop/Tauri is NOT on this path (F-bd71a354): linuxdeploy/Stage-artifact
  # must not skip PyPI.
  publish:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v'))) }}
    needs: [build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          TAG="${RELEASE_TAG#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::pyproject.toml version $VERSION does not match git tag $TAG"
            exit 1
          fi

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      # Pre-publish wheel smoke test. Catches the fail-open window between
      # hatchling build success and PyPI push (import error, missing data
      # file, broken entry point). Bounded ~2 min CI cost.
      - name: Install jq for status assertion
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Smoke test built wheel in fresh venv
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          # hatchling produces sovereignty_game-*.whl (PEP 503 underscore form);
          # `|| true` defangs `set -euo pipefail` propagating ls's nonzero exit
          # when the glob has no matches, so the defensive empty-WHEEL check
          # below can actually run. v2.0.0 shipped with two glob patterns
          # (underscore + hyphen) — the hyphen variant matched nothing and
          # killed the script via set -e BEFORE the if check; v2.0.1 fixes that.
          WHEEL=$(ls dist/sovereignty_game-*.whl 2>/dev/null | head -n1 || true)
          if [ -z "$WHEEL" ]; then
            echo "::error::No built wheel found under dist/"
            ls -la dist/
            exit 1
          fi
          echo "Smoke-testing wheel: $WHEEL"
          python -m venv "$SMOKE_DIR/venv"
          # shellcheck disable=SC1091
          source "$SMOKE_DIR/venv/bin/activate"
          pip install --upgrade pip
          # Install with both extras. [daemon] pulls starlette/uvicorn/httpx.
          # hatch wheel packages are sov_engine/sov_transport/sov_cli —
          # sov_daemon is not on the import path unless the extra's install
          # layout actually exposes it. `sov daemon --help` is CLI wiring
          # only (Typer never imports sov_daemon). Import-surface check is
          # `python -c "import sov_daemon, starlette, uvicorn"` (F-f6699291).
          pip install "${WHEEL}[xrpl,daemon]"
          # 1. --version exits 0 with a non-empty version line
          VERSION_OUT=$(sov --version)
          echo "sov --version => $VERSION_OUT"
          [ -n "$VERSION_OUT" ] || { echo "::error::sov --version produced empty output"; exit 1; }
          # 2. --help exits 0 and mentions the binary name
          HELP_OUT=$(sov --help)
          echo "$HELP_OUT" | grep -q "sov" || { echo "::error::sov --help missing binary name"; exit 1; }
          # 3. self-check JSON status must be ok or warn (not fail)
          STATUS=$(sov self-check --json | jq -r .status)
          echo "sov self-check --json status => $STATUS"
          case "$STATUS" in
            ok|warn) echo "Smoke test passed." ;;
            *) echo "::error::sov self-check --json reported status=$STATUS (expected ok|warn)"; exit 1 ;;
          esac
          # 4. CLI wiring: daemon Typer subapp is registered (does NOT
          # import sov_daemon / starlette / uvicorn).
          sov daemon --help > /dev/null || { echo "::error::sov daemon --help failed — daemon CLI not wired"; exit 1; }
          # 5. Import surface for the [daemon] extra (F-f6699291). Typer
          # --help never runs _import_daemon_api(); missing extra deps or a
          # wheel that omitted sov_daemon must fail here.
          python -c "import sov_daemon, starlette, uvicorn" || { echo "::error::[daemon] extra import surface missing (sov_daemon/starlette/uvicorn)"; exit 1; }
          deactivate
          rm -rf "$SMOKE_DIR"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # --- Platform binaries (PyInstaller) ---
  build-binaries:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v'))) }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: macos-latest
            target: darwin-arm64
            ext: ""
          # darwin-x64 omitted: macos-13 deprecated, arm64 binary works via Rosetta
          - os: windows-latest
            target: win-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - run: uv python install 3.12

      - run: uv venv

      # Pin PyInstaller exactly for reproducible release builds.
      # Bump deliberately after smoke testing the produced binary.
      - name: Install dependencies + PyInstaller
        run: uv pip install . "pyinstaller==6.11.1"

      - name: Build binary
        shell: bash
        run: |
          VERSION=${RELEASE_TAG#v}
          uv run pyinstaller --onefile --name "sovereignty" --console \
            --collect-submodules rich \
            --collect-data xrpl \
            sov_cli/__main__.py
          OUTNAME="sovereignty-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          mv "dist/sovereignty${{ matrix.ext }}" "dist/${OUTNAME}"
          echo "ASSET_NAME=${OUTNAME}" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: dist/${{ env.ASSET_NAME }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ env.ASSET_NAME }}

  # --- Tauri desktop app binaries (v2.1+) ---
  # Wave 11 BRIDGE-A-bis-003 distribution: build the Tauri shell on each
  # platform and ship the OS-native installer alongside the PyInstaller CLI
  # binaries. NO Apple/Microsoft signing — first-launch OS warnings are
  # expected and documented in README. Build provenance via
  # ``actions/attest-build-provenance`` covers the supply-chain trust layer.
  # Workspace-level signing infrastructure (Apple Developer ID +
  # Authenticode) is v2.2 work that benefits sovereignty + GlyphStudio +
  # CommandUI together.
  build-tauri-binaries:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v'))) }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: "--target universal-apple-darwin"
            bundle-base: app/src-tauri/target/universal-apple-darwin/release/bundle
            artifacts: "dmg/Sovereignty_*_universal.dmg dmg/Sovereignty_*_universal.dmg.sig macos/Sovereignty.app.tar.gz macos/Sovereignty.app.tar.gz.sig"
          - os: windows-latest
            target: win-x64
            rust-targets: ""
            tauri-args: ""
            bundle-base: app/src-tauri/target/release/bundle
            artifacts: "msi/Sovereignty_*_x64_en-US.msi msi/Sovereignty_*_x64_en-US.msi.sig msi/Sovereignty_*_x64_en-US.msi.zip msi/Sovereignty_*_x64_en-US.msi.zip.sig nsis/Sovereignty_*_x64-setup.exe nsis/Sovereignty_*_x64-setup.exe.sig nsis/Sovereignty_*_x64-setup.nsis.zip nsis/Sovereignty_*_x64-setup.nsis.zip.sig"
          # Linux ships .deb AND AppImage. Keep the .deb glob so the
          # existing Debian/Ubuntu path is unchanged. AppImage is additive
          # (JOB-027). tauri-bundler 2.6+ extract-and-run means linuxdeploy
          # does not need FUSE. NO_STRIP=true avoids old strip vs .relr.dyn.
          # Do not add OS-level signing here (JOB-028). Combined
          # --bundles deb,appimage is the happy path; a linuxdeploy failure
          # retries --bundles deb so the .deb is not discarded (F-eefbfd40).
          - os: ubuntu-latest
            target: linux-x64
            rust-targets: ""
            tauri-args: "--bundles deb,appimage"
            bundle-base: app/src-tauri/target/release/bundle
            artifacts: "deb/*_amd64.deb deb/*_amd64.deb.sig appimage/*_amd64.AppImage appimage/*_amd64.AppImage.sig appimage/*_amd64.AppImage.tar.gz appimage/*_amd64.AppImage.tar.gz.sig"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Tauri 2 webview + linuxdeploy bundler deps (Linux only).
      # webkit2gtk-4.1 + libsoup-3.0 are the v2 line; libssl-dev satisfies
      # reqwest. file/patchelf/librsvg/appindicator are required by
      # linuxdeploy; libfuse2t64 is the Ubuntu 24.04 package name.
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev \
            file patchelf libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable @ 2025-01
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        run: npm --prefix app ci

      - name: Build Tauri app
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            if ! npm --prefix app run tauri build -- ${{ matrix.tauri-args }} --verbose; then
              echo "::warning::combined --bundles deb,appimage failed (likely linuxdeploy); rebuilding .deb only"
              find app/src-tauri/target -type f \
                \( -iname '*linuxdeploy*' -o -iname '*appimage*.log' \) \
                -print -exec echo '===== {} =====' \; -exec cat {} \; || true
              npm --prefix app run tauri build -- --bundles deb --verbose
            fi
          else
            npm --prefix app run tauri build -- ${{ matrix.tauri-args }}
          fi

      # Stage artifacts under a flat dist/ with the locked naming convention:
      # ``sovereignty-app-<version>-<target>.<ext>``. The ``-app-`` infix
      # disambiguates from the existing PyInstaller CLI binaries which use
      # ``sovereignty-<version>-<target>``. Mac ships .dmg for humans and
      # .app.tar.gz for the updater; .sig files keep compound suffixes.
      # Apple/Authenticode OS signing stays gated skip (JOB-028 hold).
      - name: Stage artifact
        shell: bash
        env:
          ARTIFACT_GLOBS: ${{ matrix.artifacts }}
          BUNDLE_BASE: ${{ matrix.bundle-base }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          export VERSION ARTIFACT_GLOBS BUNDLE_BASE TARGET
          bash .github/scripts/stage-tauri-artifacts.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: dist/sovereignty-app-*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-binary-${{ matrix.target }}
          path: dist/sovereignty-app-*

  # CLI GitHub Release assets. Independent of Tauri so a desktop-matrix
  # failure still attaches PyInstaller binaries (npx contract).
  upload-cli-binaries:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v'))) }}
    needs: [build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          cd artifacts
          sha256sum * > "checksums-${VERSION}.txt"
          cat "checksums-${VERSION}.txt"

      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: artifacts/checksums-*.txt

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*

  # Desktop GitHub Release assets + Tauri updater latest.json.
  # always() so a single matrix-leg failure still attaches the other OS
  # artifacts that did upload.
  upload-tauri-binaries:
    if: ${{ always() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')))) && contains(fromJSON('["success", "failure"]'), needs.build-tauri-binaries.result) }}
    needs: [build-tauri-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: tauri-binary-*
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export VERSION="${VERSION#v}"
          python3 .github/scripts/generate-latest-json.py artifacts

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          cd artifacts
          sha256sum * > "checksums-app-${VERSION}.txt"
          cat "checksums-app-${VERSION}.txt"

      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: artifacts/checksums-app-*.txt

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
