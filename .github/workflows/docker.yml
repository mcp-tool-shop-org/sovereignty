# Container image: ghcr.io/<owner>/sovereignty (linux/amd64 + linux/arm64).
#
# Separate from publish.yml so the image can be rebuilt for an existing tag
# without re-running the one-shot PyPI upload or re-uploading release binaries.
# Fires on the same release event; Actions -> Container image -> Run workflow
# with tag=vX.Y.Z recovers a failed push. Source is always checked out AT THE
# TAG, so a dispatch from main builds exactly what the release shipped.
#
# Andon: the amd64 image is built and smoke-tested (version, self-check,
# import surface, 200 with token / 401 without) before anything is pushed.
# Compensator: delete the version from the GHCR package (Packages ->
# sovereignty -> version -> Delete) and re-point `latest` by re-running this
# workflow for the previous tag. Owner: release operator.

name: Container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and push (e.g. v2.3.2). Does not create or move tags.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/sovereignty

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Require a v* tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "::error::Container image needs a v* tag (got '$RELEASE_TAG')."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify version matches tag
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "${RELEASE_TAG#v}" ]; then
            echo "::error::pyproject.toml version $VERSION does not match tag $RELEASE_TAG"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sovereignty:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(docker run --rm sovereignty:smoke --version)
          echo "$OUT"
          [ "$OUT" = "sovereignty ${RELEASE_TAG#v}" ] || { echo "::error::image reports '$OUT'"; exit 1; }
          STATUS=$(docker run --rm sovereignty:smoke self-check --json | jq -r .status)
          case "$STATUS" in ok|warn) ;; *) echo "::error::self-check status=$STATUS"; exit 1 ;; esac
          # --entrypoint: the image entrypoint hands every argument to `sov`.
          docker run --rm --entrypoint python sovereignty:smoke -c "import sov_daemon, starlette, uvicorn, xrpl"
          docker run -d --name sov-smoke -p 127.0.0.1:47823:47823 -e SOV_DAEMON_TOKEN=smoke sovereignty:smoke
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer smoke' http://127.0.0.1:47823/health || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs sov-smoke
          [ "$code" = 200 ] || { echo "::error::daemon /health never returned 200 (last=$code)"; exit 1; }
          noauth=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47823/health)
          [ "$noauth" = 401 ] || { echo "::error::unauthenticated /health returned $noauth"; exit 1; }
          docker rm -f sov-smoke

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
          flavor: latest=true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
