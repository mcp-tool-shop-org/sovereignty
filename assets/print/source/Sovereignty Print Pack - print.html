<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sovereignty — Print Entry</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* Production print entry. No nav, no labels, no design-canvas chrome.
     Fonts: local Cormorant Garamond, IM Fell English, JetBrains Mono.
     No network at print time — vendor React + precompiled bundle. */
  @page { size: 8.5in 11in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #f4ead4; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; color: #2a1d10; }
  .sov-page {
    width: 1700px;
    height: 2200px;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }
  .sov-page:last-child { page-break-after: auto; break-after: auto; }
  body.is-loading > #pages { visibility: hidden; }
</style>
</head>
<body class="is-loading">

<main id="pages"></main>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="tokens.js"></script>
<script src="print-bundle.js"></script>
<script src="print-entry.js"></script>
</body>
</html>
